<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City: Leonida Nights — GTA6</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0a1f; }
  #game-canvas { display: block; width: 100%; height: 100%; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #2b1055 0%, #7597de 55%, #ff6e7f 100%);
    color: #fff; font: 700 28px/1.4 system-ui, sans-serif; text-align: center; z-index: 50;
  }
  #hud { position: fixed; inset: 0; pointer-events: none; font: 600 14px/1.5 system-ui, sans-serif; color: #fff; z-index: 10; }
  #hud-top { position: absolute; top: 14px; right: 18px; text-align: right; }
  #hud-wanted { font-size: 26px; letter-spacing: 4px; color: #ffd60a; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  #hud-wanted.hot { color: #ff2e63; }
  #hud-cash { font-size: 26px; color: #06d6a0; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
  #hud-health { position: absolute; top: 16px; left: 18px; width: 220px; height: 20px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 10px; overflow: hidden; }
  #hud-health-bar { height: 100%; width: 100%; background: #06d6a0; transition: width .2s; }
  #hud-health-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  #hud-weapon { position: absolute; bottom: 64px; right: 18px; font-size: 18px; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 8px; }
  #hud-radio { position: absolute; bottom: 64px; left: 18px; font-size: 16px; background: rgba(0,0,0,.55); padding: 6px 12px; border-radius: 8px; color: #ffd60a; }
  #hud-mission { position: absolute; bottom: 18px; left: 18px; max-width: 520px; background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
  #hud-toast { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.72); padding: 10px 18px; border-radius: 10px; font-size: 16px; opacity: 0; transition: opacity .25s; max-width: 80vw; text-align: center; }
  #hud-toast.show { opacity: 1; }
  #hud-minimap { position: absolute; top: 64px; right: 18px; border: 2px solid rgba(255,255,255,.4); border-radius: 8px; background: rgba(10,10,26,.85); }
  #hud-wheel, #hud-select {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(8, 8, 24, .92); border: 1px solid rgba(255,255,255,.3); border-radius: 14px;
    padding: 16px; width: 460px; max-height: 76vh; overflow-y: auto; pointer-events: auto;
  }
  #hud-wheel.hidden, #hud-select.hidden { display: none; }
  .wheel-title { font-size: 18px; color: #ffd60a; margin-bottom: 10px; }
  .wheel-item { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .wheel-item:hover { background: rgba(255,255,255,.12); }
  .wheel-item.active { background: rgba(6, 214, 160, .3); }
  .wheel-item.locked { opacity: .45; cursor: default; }
  .dim { color: rgba(255,255,255,.65); font-size: 12px; }
  #hud-status {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    font-size: 84px; font-weight: 900; color: #ff2e63; text-shadow: 0 4px 30px rgba(0,0,0,.8);
    display: none; letter-spacing: 8px;
  }
  #hud-help { position: absolute; bottom: 18px; right: 18px; font-size: 11px; color: rgba(255,255,255,.6); max-width: 300px; text-align: right; }
</style>
</head>
<body>
<div id="loading">VICE CITY: LEONIDA NIGHTS<br><span style="font-size:16px;font-weight:400">loading the city…</span></div>
<canvas id="game-canvas"></canvas>
<div id="hud"></div>
<script src="src/boot.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    if (window.Leonida && window.Leonida.boot) window.Leonida.boot.boot();
  });
</script>
</body>
</html>
